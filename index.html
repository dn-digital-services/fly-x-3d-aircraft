<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLY X 3D Aircraft</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030817;
    font-family:Arial,sans-serif;
}

#title{
    position:fixed;
    top:25px;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    font-size:38px;
    font-weight:800;
    letter-spacing:10px;
    z-index:5;
    text-shadow:0 0 20px #168cff;
    pointer-events:none;
}

#hint{
    position:fixed;
    bottom:22px;
    left:0;
    width:100%;
    text-align:center;
    color:#8bbde8;
    font-size:13px;
    z-index:5;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="title">FLY X</div>
<div id="hint">DRAG TO ROTATE • PINCH TO ZOOM</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {OrbitControls} from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x030817);

const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,3.2,9);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


/* =========================
   CONTROLS
========================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.minDistance = 4;
controls.maxDistance = 16;

controls.target.set(0,0,0);


/* =========================
   LIGHTING
========================= */

const ambient = new THREE.AmbientLight(
    0x6da8ff,
    1.8
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
    0xffffff,
    4
);

keyLight.position.set(5,8,7);
keyLight.castShadow = true;

scene.add(keyLight);


const blueLight = new THREE.PointLight(
    0x008cff,
    15,
    15
);

blueLight.position.set(-5,2,4);

scene.add(blueLight);


const goldLight = new THREE.PointLight(
    0xffa800,
    12,
    12
);

goldLight.position.set(5,1,-3);

scene.add(goldLight);


/* =========================
   AIRCRAFT GROUP
========================= */

const aircraft = new THREE.Group();

scene.add(aircraft);


/* =========================
   MATERIALS
========================= */

const bodyMaterial = new THREE.MeshStandardMaterial({
    color:0x182c42,
    metalness:0.85,
    roughness:0.22
});

const darkMaterial = new THREE.MeshStandardMaterial({
    color:0x07111e,
    metalness:0.75,
    roughness:0.28
});

const blueMaterial = new THREE.MeshStandardMaterial({
    color:0x078cff,
    metalness:0.7,
    roughness:0.2,
    emissive:0x002c66,
    emissiveIntensity:0.5
});

const goldMaterial = new THREE.MeshStandardMaterial({
    color:0xffb52e,
    metalness:0.8,
    roughness:0.18,
    emissive:0x542900,
    emissiveIntensity:0.3
});

const glassMaterial = new THREE.MeshPhysicalMaterial({
    color:0x06192b,
    metalness:0.25,
    roughness:0.08,
    transmission:0.35,
    transparent:true,
    opacity:0.92
});

const whiteMaterial = new THREE.MeshStandardMaterial({
    color:0xddeaff,
    metalness:0.75,
    roughness:0.2
});


/* =========================
   MAIN BODY
========================= */

const bodyGeo = new THREE.CapsuleGeometry(
    1.05,
    3.6,
    12,
    32
);

const body = new THREE.Mesh(
    bodyGeo,
    bodyMaterial
);

body.rotation.z = Math.PI/2;

body.scale.set(
    0.95,
    1,
    1
);

body.castShadow = true;

aircraft.add(body);


/* =========================
   NOSE
========================= */

const noseGeo = new THREE.SphereGeometry(
    1.04,
    32,
    20
);

const nose = new THREE.Mesh(
    noseGeo,
    bodyMaterial
);

nose.scale.set(
    0.75,
    0.72,
    1
);

nose.position.z = -2.0;

nose.castShadow = true;

aircraft.add(nose);


/* =========================
   COCKPIT
========================= */

const cockpitGeo = new THREE.SphereGeometry(
    0.85,
    32,
    20
);

const cockpit = new THREE.Mesh(
    cockpitGeo,
    glassMaterial
);

cockpit.scale.set(
    0.72,
    0.42,
    1.15
);

cockpit.position.set(
    0,
    0.72,
    -0.45
);

aircraft.add(cockpit);


/* COCKPIT GOLD FRAME */

const frameGeo = new THREE.TorusGeometry(
    0.7,
    0.055,
    8,
    32
);

const frame = new THREE.Mesh(
    frameGeo,
    goldMaterial
);

frame.rotation.x = Math.PI/2;

frame.scale.set(
    1,
    0.55,
    1
);

frame.position.set(
    0,
    0.72,
    -0.45
);

aircraft.add(frame);


/* =========================
   MAIN WINGS
========================= */

function createWing(side){

    const shape = new THREE.Shape();

    shape.moveTo(0,0);
    shape.lineTo(3.8,0.15);
    shape.lineTo(3.25,-0.45);
    shape.lineTo(0.5,-0.35);
    shape.closePath();

    const geo = new THREE.ExtrudeGeometry(
        shape,
        {
            depth:0.16,
            bevelEnabled:true,
            bevelSegments:2,
            bevelSize:0.04,
            bevelThickness:0.04
        }
    );

    const wing = new THREE.Mesh(
        geo,
        bodyMaterial
    );

    wing.rotation.y =
        side === 1 ? 0.02 : Math.PI;

    wing.rotation.x = -0.04;

    wing.position.set(
        side * 0.35,
        0,
        -0.1
    );

    wing.scale.x = 1;

    wing.castShadow = true;

    aircraft.add(wing);


    /* GOLD EDGE */

    const edgeGeo =
        new THREE.BoxGeometry(
            3.2,
            0.055,
            0.06
        );

    const edge = new THREE.Mesh(
        edgeGeo,
        goldMaterial
    );

    edge.position.set(
        side * 1.95,
        0.05,
        -0.15
    );

    edge.rotation.z =
        side === 1 ? -0.05 : 0.05;

    aircraft.add(edge);
}

createWing(1);
createWing(-1);


/* =========================
   REAR TAIL WINGS
========================= */

function createTailWing(side){

    const geo = new THREE.BoxGeometry(
        1.65,
        0.12,
        0.55
    );

    const wing = new THREE.Mesh(
        geo,
        blueMaterial
    );

    wing.position.set(
        side * 0.8,
        0.15,
        1.85
    );

    wing.rotation.z =
        side === 1 ? -0.14 : 0.14;

    aircraft.add(wing);
}

createTailWing(1);
createTailWing(-1);


/* =========================
   VERTICAL TAIL
========================= */

const tailGeo = new THREE.BoxGeometry(
    0.18,
    1.35,
    0.8
);

const tail = new THREE.Mesh(
    tailGeo,
    bodyMaterial
);

tail.position.set(
    0,
    0.65,
    1.65
);

tail.rotation.z = -0.12;

aircraft.add(tail);


/* =========================
   TAIL GOLD STRIPE
========================= */

const stripeGeo =
    new THREE.BoxGeometry(
        0.2,
        0.95,
        0.06
    );

const stripe = new THREE.Mesh(
    stripeGeo,
    goldMaterial
);

stripe.position.set(
    0,
    0.67,
    1.22
);

aircraft.add(stripe);


/* =========================
   ENGINE PODS
========================= */

function createEngine(side){

    const geo = new THREE.CylinderGeometry(
        0.32,
        0.42,
        1.25,
        24
    );

    const engine = new THREE.Mesh(
        geo,
        darkMaterial
    );

    engine.rotation.z = Math.PI/2;

    engine.position.set(
        side * 1.05,
        -0.15,
        -0.55
    );

    aircraft.add(engine);


    const glowGeo =
        new THREE.CylinderGeometry(
            0.22,
            0.22,
            0.08,
            24
        );

    const glowMat =
        new THREE.MeshBasicMaterial({
            color:0x00aaff
        });

    const glow = new THREE.Mesh(
        glowGeo,
        glowMat
    );

    glow.rotation.z = Math.PI/2;

    glow.position.set(
        side * 1.05,
        -0.15,
        -1.18
    );

    aircraft.add(glow);
}

createEngine(1);
createEngine(-1);


/* =========================
   FRONT PROPELLER
========================= */

const propeller = new THREE.Group();

propeller.position.set(
    0,
    0,
    -2.92
);

aircraft.add(propeller);


/* Propeller center */

const hubGeo =
    new THREE.SphereGeometry(
        0.28,
        24,
        24
    );

const hub = new THREE.Mesh(
    hubGeo,
    goldMaterial
);

propeller.add(hub);


/* Blades */

for(let i=0;i<4;i++){

    const bladeGeo =
        new THREE.BoxGeometry(
            0.18,
            1.65,
            0.07
        );

    const blade = new THREE.Mesh(
        bladeGeo,
        darkMaterial
    );

    blade.position.y = 0.82;

    blade.rotation.z =
        i * Math.PI/2;

    blade.castShadow = true;

    propeller.add(blade);
}


/* =========================
   FRONT LIGHT
========================= */

const lightGeo =
    new THREE.SphereGeometry(
        0.11,
        16,
        16
    );

const frontLight = new THREE.Mesh(
    lightGeo,
    new THREE.MeshBasicMaterial({
        color:0x00eaff
    })
);

frontLight.position.set(
    0,
    -0.15,
    -3.0
);

aircraft.add(frontLight);


/* =========================
   FLY X LOGO
========================= */

const canvas = document.createElement("canvas");

canvas.width = 512;
canvas.height = 128;

const ctx = canvas.getContext("2d");

ctx.clearRect(0,0,512,128);

ctx.font = "bold 90px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillStyle = "#ffffff";

ctx.fillText(
    "FLY X",
    256,
    64
);

const logoTexture =
    new THREE.CanvasTexture(canvas);

const logoMaterial =
    new THREE.MeshBasicMaterial({
        map:logoTexture,
        transparent:true
    });

const logoGeo =
    new THREE.PlaneGeometry(
        1.7,
        0.43
    );

const logo = new THREE.Mesh(
    logoGeo,
    logoMaterial
);

logo.position.set(
    0,
    0.03,
    -1.02
);

logo.rotation.y = Math.PI;

logo.scale.set(
    1,
    1,
    1
);

aircraft.add(logo);


/* =========================
   GLOW UNDER AIRCRAFT
========================= */

const glowGeo =
    new THREE.CircleGeometry(
        3.5,
        64
    );

const glowMat =
    new THREE.MeshBasicMaterial({
        color:0x0066ff,
        transparent:true,
        opacity:0.10,
        side:THREE.DoubleSide
    });

const glow = new THREE.Mesh(
    glowGeo,
    glowMat
);

glow.rotation.x = -Math.PI/2;

glow.position.y = -1.25;

scene.add(glow);


/* =========================
   START POSITION
========================= */

aircraft.rotation.y = Math.PI;

aircraft.position.y = 0;


/* =========================
   ANIMATION
========================= */

function animate(){

    requestAnimationFrame(animate);

    /* rotating propeller */
    propeller.rotation.z += 0.45;

    /* subtle floating */
    aircraft.position.y =
        Math.sin(Date.now()*0.0015) * 0.08;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================
   RESPONSIVE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
