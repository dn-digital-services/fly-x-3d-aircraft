<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLY X 3D Aircraft</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050b16;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #title {
      position: fixed;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font: bold 26px Arial;
      letter-spacing: 5px;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="title">FLY X</div>

<script type="module">

import * as THREE from
"https://esm.sh/three@0.180.0";

import { OrbitControls } from
"https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js";


const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050b16);


const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(7, 4, 9);


const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// LIGHTS

scene.add(
  new THREE.AmbientLight(0xffffff, 2)
);

const light = new THREE.DirectionalLight(
  0xffffff,
  4
);

light.position.set(5, 8, 10);

scene.add(light);


const blueLight = new THREE.PointLight(
  0x0099ff,
  10,
  30
);

blueLight.position.set(0, 2, 5);

scene.add(blueLight);


// AIRCRAFT

const aircraft = new THREE.Group();

scene.add(aircraft);


// MATERIALS

const bodyMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x354454,
    metalness: 0.9,
    roughness: 0.2
  });


const darkMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x07101c,
    metalness: 0.8,
    roughness: 0.2
  });


const blueMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x008cff,
    emissive: 0x003d77,
    emissiveIntensity: 1.5,
    metalness: 0.6,
    roughness: 0.2
  });


// MAIN BODY

const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      1,
      3.8,
      8,
      24
    ),
    bodyMaterial
  );

body.rotation.z = Math.PI / 2;

body.scale.set(
  1,
  0.7,
  0.7
);

aircraft.add(body);


// NOSE

const nose =
  new THREE.Mesh(
    new THREE.ConeGeometry(
      1,
      2.2,
      32
    ),
    bodyMaterial
  );

nose.rotation.z = -Math.PI / 2;

nose.position.x = 2.8;

aircraft.add(nose);


// COCKPIT

const cockpit =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1,
      32,
      16
    ),
    new THREE.MeshStandardMaterial({
      color: 0x041725,
      metalness: 0.8,
      roughness: 0.05
    })
  );

cockpit.scale.set(
  1.2,
  0.6,
  0.65
);

cockpit.position.set(
  1.1,
  0,
  0.65
);

aircraft.add(cockpit);


// WINGS

function createWing(side) {

  const wing =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        3.8,
        0.18,
        1.4
      ),
      darkMaterial
    );

  wing.position.set(
    -0.1,
    side * 1.5,
    0
  );

  wing.rotation.z =
    side === 1 ? -0.12 : 0.12;

  aircraft.add(wing);
}

createWing(1);
createWing(-1);


// TAIL

const tail =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.5,
      0.16,
      1.3
    ),
    blueMaterial
  );

tail.position.set(
  -2.3,
  0,
  0.8
);

aircraft.add(tail);


// FRONT ROTOR

const rotor =
  new THREE.Group();

rotor.position.set(
  3.9,
  0,
  0
);

aircraft.add(rotor);


for (let i = 0; i < 4; i++) {

  const blade =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.2,
        0.08,
        0.16
      ),
      darkMaterial
    );

  blade.rotation.z =
    i * Math.PI / 2;

  rotor.add(blade);
}


// ROTOR HUB

rotor.add(
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.3,
      24,
      16
    ),
    blueMaterial
  )
);


// CONTROLS

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.autoRotate = true;

controls.autoRotateSpeed = 1.5;


// ANIMATION

function animate() {

  requestAnimationFrame(animate);

  rotor.rotation.x += 0.15;

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();


// RESPONSIVE

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>

</body>
</html>
