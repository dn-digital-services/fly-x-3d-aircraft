<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FLY X - 3D Helicopter</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030817;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#title{
    position:fixed;
    top:24px;
    left:0;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:38px;
    font-weight:900;
    letter-spacing:10px;
    z-index:10;
    pointer-events:none;
    text-shadow:
        0 0 8px rgba(255,40,40,.8),
        0 0 25px rgba(255,0,0,.5);
}

#hint{
    position:fixed;
    bottom:28px;
    left:0;
    width:100%;
    text-align:center;
    color:#ff9a9a;
    font-size:13px;
    letter-spacing:.5px;
    z-index:10;
    pointer-events:none;
    text-shadow:0 0 8px #ff2020;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ff5555;
    font-size:15px;
    z-index:20;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="title">FLY X</div>
<div id="hint">DRAG TO ROTATE • PINCH TO ZOOM</div>
<div id="loading">LOADING FLY X...</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x030817);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    40,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(
    7,
    3.8,
    9
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.25;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.enablePan = false;

controls.minDistance = 4;
controls.maxDistance = 18;

controls.target.set(
    0,
    0,
    0
);


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.8
    )
);


const keyLight =
new THREE.DirectionalLight(
    0xffffff,
    4.5
);

keyLight.position.set(
    6,
    9,
    8
);

keyLight.castShadow = true;

scene.add(keyLight);


const redLight =
new THREE.PointLight(
    0xff1010,
    30,
    18
);

redLight.position.set(
    2,
    2,
    4
);

scene.add(redLight);


const redRearLight =
new THREE.PointLight(
    0xff0000,
    25,
    16
);

redRearLight.position.set(
    -4,
    1,
    -5
);

scene.add(redRearLight);


const whiteLight =
new THREE.PointLight(
    0xffffff,
    12,
    14
);

whiteLight.position.set(
    0,
    5,
    2
);

scene.add(whiteLight);


/* =========================================================
   MATERIALS
========================================================= */

const blackMat =
new THREE.MeshStandardMaterial({
    color:0x090b10,
    metalness:0.85,
    roughness:0.2
});


const black2Mat =
new THREE.MeshStandardMaterial({
    color:0x151920,
    metalness:0.75,
    roughness:0.24
});


const redMat =
new THREE.MeshStandardMaterial({
    color:0xd90012,
    metalness:0.72,
    roughness:0.18,
    emissive:0x390000,
    emissiveIntensity:0.35
});


const redGlowMat =
new THREE.MeshBasicMaterial({
    color:0xff1010
});


const glassMat =
new THREE.MeshPhysicalMaterial({
    color:0x020509,
    metalness:0.15,
    roughness:0.08,
    transmission:0.15,
    transparent:true,
    opacity:0.94
});


/* =========================================================
   HELICOPTER ROOT
========================================================= */

const helicopter =
new THREE.Group();

scene.add(helicopter);


/* =========================================================
   HELPER FUNCTIONS
========================================================= */

function addMesh(
    geometry,
    material,
    position,
    scale = [1,1,1],
    rotation = [0,0,0]
){

    const mesh =
    new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(
        position[0],
        position[1],
        position[2]
    );

    mesh.scale.set(
        scale[0],
        scale[1],
        scale[2]
    );

    mesh.rotation.set(
        rotation[0],
        rotation[1],
        rotation[2]
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    helicopter.add(mesh);

    return mesh;
}


/* =========================================================
   MAIN FUSELAGE
========================================================= */

const body =
addMesh(
    new THREE.SphereGeometry(
        1,
        48,
        32
    ),
    blackMat,
    [0,0,-0.15],
    [2.65,1.15,3.05],
    [0,0,0]
);


/* lower body */

addMesh(
    new THREE.SphereGeometry(
        1,
        40,
        24
    ),
    black2Mat,
    [0,-0.38,-0.35],
    [2.35,0.72,2.35]
);


/* =========================================================
   NOSE
========================================================= */

addMesh(
    new THREE.SphereGeometry(
        1,
        40,
        28
    ),
    blackMat,
    [0,0.02,2.15],
    [1.72,0.92,1.45]
);


/* =========================================================
   RED NOSE LOWER ACCENT
========================================================= */

addMesh(
    new THREE.SphereGeometry(
        1,
        32,
        20
    ),
    redMat,
    [0,-0.48,1.75],
    [1.45,0.16,0.9]
);


/* =========================================================
   COCKPIT GLASS
========================================================= */

addMesh(
    new THREE.SphereGeometry(
        1,
        40,
        28
    ),
    glassMat,
    [0,0.55,1.55],
    [1.48,0.48,1.18]
);


/* =========================================================
   COCKPIT CENTER DIVIDER
========================================================= */

addMesh(
    new THREE.BoxGeometry(
        0.10,
        0.8,
        1.65
    ),
    black2Mat,
    [0,0.55,1.55]
);


/* =========================================================
   SIDE WINDOWS
========================================================= */

function createSideWindow(side){

    addMesh(
        new THREE.SphereGeometry(
            1,
            32,
            20
        ),
        glassMat,
        [side*1.12,0.58,1.45],
        [0.08,0.42,0.88],
        [0,0,0]
    );

    /* red window outline */

    addMesh(
        new THREE.BoxGeometry(
            0.055,
            0.055,
            1.35
        ),
        redGlowMat,
        [side*1.23,0.58,1.45]
    );
}

createSideWindow(1);
createSideWindow(-1);


/* =========================================================
   UPPER CABIN
========================================================= */

addMesh(
    new THREE.SphereGeometry(
        1,
        32,
        20
    ),
    black2Mat,
    [0,1.02,-0.35],
    [1.25,0.48,1.25]
);


/* =========================================================
   ENGINE INTAKES
========================================================= */

function createIntake(side){

    const intake =
    addMesh(
        new THREE.CylinderGeometry(
            0.25,
            0.32,
            0.55,
            24
        ),
        blackMat,
        [side*1.05,1.15,-0.15],
        [1,1,1],
        [0,0,Math.PI/2]
    );

    addMesh(
        new THREE.CylinderGeometry(
            0.18,
            0.18,
            0.04,
            24
        ),
        redGlowMat,
        [side*1.34,1.15,-0.15],
        [1,1,1],
        [0,0,Math.PI/2]
    );
}

createIntake(1);
createIntake(-1);


/* =========================================================
   RED SIDE LIGHTNING STRIP
========================================================= */

function createRedStrip(side){

    addMesh(
        new THREE.BoxGeometry(
            0.055,
            0.055,
            3.8
        ),
        redGlowMat,
        [side*1.36,-0.05,-0.05],
        [1,1,1],
        [0,0,-0.08]
    );

}

createRedStrip(1);
createRedStrip(-1);


/* =========================================================
   LONG TAIL BOOM
========================================================= */

addMesh(
    new THREE.CylinderGeometry(
        0.30,
        0.55,
        5.4,
        24
    ),
    blackMat,
    [0,0,-4.15],
    [1,1,1],
    [Math.PI/2,0,0]
);


/* =========================================================
   RED TAIL STRIP
========================================================= */

addMesh(
    new THREE.BoxGeometry(
        0.08,
        0.08,
        4.9
    ),
    redGlowMat,
    [0,-0.10,-4.15]
);


/* =========================================================
   VERTICAL TAIL FIN
========================================================= */

const tailFin =
new THREE.Shape();

tailFin.moveTo(0,0);
tailFin.lineTo(0.1,2.0);
tailFin.lineTo(0.55,2.45);
tailFin.lineTo(0.7,0);
tailFin.closePath();


const tailGeometry =
new THREE.ExtrudeGeometry(
    tailFin,
    {
        depth:0.22,
        bevelEnabled:true,
        bevelSize:0.08,
        bevelThickness:0.05,
        bevelSegments:3
    }
);

addMesh(
    tailGeometry,
    blackMat,
    [-0.35,0,-6.55],
    [1,1,1],
    [0,0,0]
);


/* red tail fin panel */

addMesh(
    new THREE.BoxGeometry(
        0.08,
        1.25,
        0.25
    ),
    redMat,
    [0.37,0.95,-6.55],
    [1,1,1]
);


/* =========================================================
   TAIL ROTOR
========================================================= */

const tailRotor =
new THREE.Group();

tailRotor.position.set(
    0.42,
    0.05,
    -6.82
);

helicopter.add(tailRotor);


/* tail hub */

tailRotor.add(
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.22,
            24,
            24
        ),
        redMat
    )
);


/* tail rotor blades */

for(let i=0;i<6;i++){

    const blade =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.10,
            1.35,
            0.07
        ),
        black2Mat
    );

    blade.position.y =
    0.65;

    blade.rotation.z =
    i * Math.PI / 3;

    tailRotor.add(blade);
}


/* tail red ring */

const tailRing =
new THREE.Mesh(
    new THREE.TorusGeometry(
        0.78,
        0.045,
        8,
        40
    ),
    redGlowMat
);

tailRotor.add(tailRing);


/* =========================================================
   MAIN ROTOR ASSEMBLY
========================================================= */

const mainRotor =
new THREE.Group();

mainRotor.position.set(
    0,
    1.55,
    -0.25
);

helicopter.add(mainRotor);


/* rotor mast */

mainRotor.add(
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.12,
            0.12,
            1.0,
            20
        ),
        black2Mat
    )
);


/* rotor hub */

const rotorHub =
new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.28,
        0.28,
        0.18,
        24
    ),
    redMat
);

rotorHub.position.y =
0.5;

mainRotor.add(rotorHub);


/* rotor blades */

for(let i=0;i<4;i++){

    const blade =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.20,
            0.08,
            7.0
        ),
        black2Mat
    );

    blade.position.y =
    0.53;

    blade.rotation.y =
    i * Math.PI / 2;

    blade.castShadow = true;

    mainRotor.add(blade);


    /* red blade accent */

    const redBlade =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.05,
            0.025,
            6.6
        ),
        redGlowMat
    );

    redBlade.position.y =
    0.58;

    redBlade.rotation.y =
    i * Math.PI / 2;

    mainRotor.add(redBlade);
}


/* =========================================================
   LANDING SKIDS
========================================================= */

function createSkid(side){

    /* main skid */

    const skid =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.075,
            0.075,
            4.4,
            16
        ),
        black2Mat
    );

    skid.rotation.z =
    Math.PI/2;

    skid.position.set(
        side*0.85,
        -1.25,
        0.15
    );

    skid.castShadow = true;

    helicopter.add(skid);


    /* front curved support */

    const frontSupport =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.075,
            0.075,
            1.15,
            16
        ),
        black2Mat
    );

    frontSupport.position.set(
        side*0.85,
        -0.72,
        1.05
    );

    frontSupport.rotation.z =
    side * 0.28;

    helicopter.add(frontSupport);


    /* rear support */

    const rearSupport =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.075,
            0.075,
            1.05,
            16
        ),
        black2Mat
    );

    rearSupport.position.set(
        side*0.85,
        -0.72,
        -1.0
    );

    rearSupport.rotation.z =
    -side * 0.28;

    helicopter.add(rearSupport);


    /* red skid light */

    const skidLight =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.055,
            0.055,
            3.1
        ),
        redGlowMat
    );

    skidLight.position.set(
        side*0.85,
        -1.34,
        0.15
    );

    helicopter.add(skidLight);
}

createSkid(1);
createSkid(-1);


/* =========================================================
   FRONT HEADLIGHT
========================================================= */

addMesh(
    new THREE.SphereGeometry(
        0.13,
        20,
        20
    ),
    redGlowMat,
    [0,-0.08,2.95]
);


/* =========================================================
   REAR ENGINE GLOW
========================================================= */

function createEngineGlow(side){

    addMesh(
        new THREE.CylinderGeometry(
            0.24,
            0.24,
            0.12,
            24
        ),
        redGlowMat,
        [side*1.05,-0.35,-1.85],
        [1,1,1],
        [Math.PI/2,0,0]
    );
}

createEngineGlow(1);
createEngineGlow(-1);


/* =========================================================
   GROUND
========================================================= */

const ground =
new THREE.Mesh(
    new THREE.CircleGeometry(
        9,
        64
    ),
    new THREE.MeshBasicMaterial({
        color:0x020611,
        transparent:true,
        opacity:0.7
    })
);

ground.rotation.x =
-Math.PI/2;

ground.position.y =
-1.5;

scene.add(ground);


/* =========================================================
   RED GLOW UNDER HELICOPTER
========================================================= */

const glow =
new THREE.Mesh(
    new THREE.CircleGeometry(
        4.5,
        64
    ),
    new THREE.MeshBasicMaterial({
        color:0xff0000,
        transparent:true,
        opacity:0.055,
        side:THREE.DoubleSide
    })
);

glow.rotation.x =
-Math.PI/2;

glow.position.y =
-1.47;

scene.add(glow);


/* =========================================================
   START POSITION
========================================================= */

helicopter.position.set(
    0,
    0,
    0
);


/*
   Camera looks at the helicopter.
   Nose is toward +Z.
*/

controls.target.set(
    0,
    0,
    0
);

camera.lookAt(
    0,
    0,
    0
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const time =
    clock.getElapsedTime();


    /* Main rotor */

    mainRotor.rotation.y +=
    0.055;


    /* Tail rotor */

    tailRotor.rotation.z +=
    0.12;


    /* subtle floating */

    helicopter.position.y =
    Math.sin(time * 1.5) * 0.06;


    /* red glow pulse */

    redLight.intensity =
    26 +
    Math.sin(time * 4) * 5;


    glow.material.opacity =
    0.045 +
    Math.sin(time * 2) * 0.012;


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   REMOVE LOADING
========================================================= */

document.getElementById(
    "loading"
).style.display = "none";


/* =========================================================
   START
========================================================= */

animate();


/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        const width =
        window.innerWidth;

        const height =
        window.innerHeight;

        camera.aspect =
        width / height;

        camera.updateProjectionMatrix();

        renderer.setSize(
            width,
            height
        );
    }
);

</script>

</body>
</html>
