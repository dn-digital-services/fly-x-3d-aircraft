<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>FLY X 3D Aircraft</title>

<!-- IMPORTANT FIX:
     OrbitControls ke "three" import ko resolve karta hai -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030817;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}

canvas{
    display:block;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#title{
    position:fixed;
    top:25px;
    left:0;
    width:100%;
    text-align:center;

    color:#ffffff;

    font-size:38px;
    font-weight:800;

    letter-spacing:10px;

    z-index:10;
    pointer-events:none;

    text-shadow:
        0 0 8px rgba(80,170,255,.9),
        0 0 25px rgba(0,120,255,.7),
        0 0 45px rgba(0,100,255,.35);
}

#hint{
    position:fixed;
    bottom:28px;
    left:0;
    width:100%;

    text-align:center;

    color:#8fc7f5;

    font-size:14px;
    letter-spacing:.3px;

    z-index:10;
    pointer-events:none;

    text-shadow:0 0 8px #006cff;
}

#error{
    display:none;

    position:fixed;

    left:20px;
    right:20px;
    top:100px;

    padding:15px;

    border-radius:12px;

    background:#250d12;

    color:#ffb5b5;

    z-index:30;

    text-align:center;

    font-size:13px;
}

</style>
</head>

<body>

<div id="title">FLY X</div>

<div id="hint">
DRAG TO ROTATE • PINCH TO ZOOM
</div>

<div id="error"></div>


<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   ERROR BOX
========================================================= */

const errorBox =
document.getElementById("error");

window.addEventListener("error",(event)=>{

    console.error(event.error || event.message);

});


/* =========================================================
   SCENE
========================================================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x030817);


/* =========================================================
   CAMERA
========================================================= */

const camera =
new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

/* Aircraft clearly visible */

camera.position.set(
    0,
    2.4,
    9
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
new THREE.WebGLRenderer({

    antialias:true,

    alpha:false,

    powerPreference:"high-performance"

});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
1.35;

renderer.shadowMap.enabled =
true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping =
true;

controls.dampingFactor =
0.07;

controls.enablePan =
false;

controls.minDistance =
4;

controls.maxDistance =
15;

controls.target.set(
    0,
    0,
    0
);


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight =
new THREE.AmbientLight(
    0xffffff,
    2.4
);

scene.add(
    ambientLight
);


/* Main light */

const mainLight =
new THREE.DirectionalLight(
    0xffffff,
    5
);

mainLight.position.set(
    5,
    8,
    8
);

mainLight.castShadow =
true;

scene.add(
    mainLight
);


/* Front blue light */

const blueLight =
new THREE.PointLight(
    0x168cff,
    25,
    22
);

blueLight.position.set(
    -4,
    3,
    6
);

scene.add(
    blueLight
);


/* Rear blue light */

const rearLight =
new THREE.PointLight(
    0x0066ff,
    20,
    20
);

rearLight.position.set(
    4,
    2,
    -5
);

scene.add(
    rearLight
);


/* Warm light */

const warmLight =
new THREE.PointLight(
    0xffaa33,
    10,
    15
);

warmLight.position.set(
    5,
    5,
    1
);

scene.add(
    warmLight
);


/* =========================================================
   AIRCRAFT GROUP
========================================================= */

const aircraft =
new THREE.Group();

scene.add(
    aircraft
);


/* =========================================================
   MATERIALS
========================================================= */

const bodyMaterial =
new THREE.MeshStandardMaterial({

    color:0x31506d,

    metalness:0.65,

    roughness:0.25

});


const darkMaterial =
new THREE.MeshStandardMaterial({

    color:0x182b3f,

    metalness:0.55,

    roughness:0.3

});


const blueMaterial =
new THREE.MeshStandardMaterial({

    color:0x087dff,

    metalness:0.55,

    roughness:0.2,

    emissive:0x003b88,

    emissiveIntensity:0.45

});


const goldMaterial =
new THREE.MeshStandardMaterial({

    color:0xffb72e,

    metalness:0.7,

    roughness:0.2,

    emissive:0x5c2d00,

    emissiveIntensity:0.25

});


const glassMaterial =
new THREE.MeshPhysicalMaterial({

    color:0x0a2b4a,

    metalness:0.15,

    roughness:0.08,

    transmission:0.15,

    transparent:true,

    opacity:0.95

});


/* =========================================================
   MAIN BODY
========================================================= */

const bodyGeometry =
new THREE.CapsuleGeometry(
    1.0,
    3.6,
    16,
    32
);

const body =
new THREE.Mesh(
    bodyGeometry,
    bodyMaterial
);

body.rotation.z =
Math.PI / 2;

body.castShadow =
true;

body.receiveShadow =
true;

aircraft.add(
    body
);


/* =========================================================
   NOSE
========================================================= */

const noseGeometry =
new THREE.SphereGeometry(
    1.02,
    32,
    24
);

const nose =
new THREE.Mesh(
    noseGeometry,
    bodyMaterial
);

nose.scale.set(
    0.78,
    0.72,
    1
);

nose.position.set(
    0,
    0,
    -2.0
);

nose.castShadow =
true;

aircraft.add(
    nose
);


/* =========================================================
   COCKPIT
========================================================= */

const cockpitGeometry =
new THREE.SphereGeometry(
    0.82,
    32,
    24
);

const cockpit =
new THREE.Mesh(
    cockpitGeometry,
    glassMaterial
);

cockpit.scale.set(
    0.72,
    0.42,
    1.15
);

cockpit.position.set(
    0,
    0.72,
    -0.45
);

aircraft.add(
    cockpit
);


/* =========================================================
   COCKPIT GOLD FRAME
========================================================= */

const frameGeometry =
new THREE.TorusGeometry(
    0.68,
    0.055,
    10,
    40
);

const frame =
new THREE.Mesh(
    frameGeometry,
    goldMaterial
);

frame.rotation.x =
Math.PI / 2;

frame.scale.set(
    1,
    0.55,
    1
);

frame.position.set(
    0,
    0.72,
    -0.45
);

aircraft.add(
    frame
);


/* =========================================================
   MAIN WINGS
========================================================= */

function createWing(side){

    const shape =
    new THREE.Shape();

    shape.moveTo(0,0);

    shape.lineTo(
        3.6,
        0.15
    );

    shape.lineTo(
        3.05,
        -0.45
    );

    shape.lineTo(
        0.4,
        -0.35
    );

    shape.closePath();


    const geometry =
    new THREE.ExtrudeGeometry(
        shape,
        {
            depth:0.18,

            bevelEnabled:true,

            bevelSegments:3,

            bevelSize:0.045,

            bevelThickness:0.045
        }
    );


    const wing =
    new THREE.Mesh(
        geometry,
        bodyMaterial
    );


    wing.rotation.y =
        side === 1
        ? 0
        : Math.PI;


    wing.rotation.x =
    -0.04;


    wing.position.set(
        side * 0.35,
        -0.05,
        -0.1
    );


    wing.castShadow =
    true;

    wing.receiveShadow =
    true;

    aircraft.add(
        wing
    );


    /* GOLD EDGE */

    const edgeGeometry =
    new THREE.BoxGeometry(
        3.05,
        0.07,
        0.07
    );

    const edge =
    new THREE.Mesh(
        edgeGeometry,
        goldMaterial
    );

    edge.position.set(
        side * 1.95,
        0.02,
        -0.16
    );

    edge.rotation.z =
        side === 1
        ? -0.05
        : 0.05;

    aircraft.add(
        edge
    );
}

createWing(1);
createWing(-1);


/* =========================================================
   REAR TAIL WINGS
========================================================= */

function createTailWing(side){

    const geometry =
    new THREE.BoxGeometry(
        1.65,
        0.14,
        0.58
    );

    const wing =
    new THREE.Mesh(
        geometry,
        blueMaterial
    );

    wing.position.set(
        side * 0.78,
        0.12,
        1.78
    );

    wing.rotation.z =
        side === 1
        ? -0.12
        : 0.12;

    wing.castShadow =
    true;

    aircraft.add(
        wing
    );
}

createTailWing(1);
createTailWing(-1);


/* =========================================================
   VERTICAL TAIL
========================================================= */

const tailGeometry =
new THREE.BoxGeometry(
    0.20,
    1.35,
    0.82
);

const tail =
new THREE.Mesh(
    tailGeometry,
    bodyMaterial
);

tail.position.set(
    0,
    0.62,
    1.58
);

tail.rotation.z =
-0.12;

tail.castShadow =
true;

aircraft.add(
    tail
);


/* =========================================================
   TAIL GOLD STRIPE
========================================================= */

const stripeGeometry =
new THREE.BoxGeometry(
    0.21,
    0.9,
    0.07
);

const stripe =
new THREE.Mesh(
    stripeGeometry,
    goldMaterial
);

stripe.position.set(
    0,
    0.67,
    1.15
);

aircraft.add(
    stripe
);


/* =========================================================
   ENGINE PODS
========================================================= */

function createEngine(side){

    const geometry =
    new THREE.CylinderGeometry(
        0.34,
        0.44,
        1.3,
        28
    );

    const engine =
    new THREE.Mesh(
        geometry,
        darkMaterial
    );

    engine.rotation.z =
    Math.PI / 2;

    engine.position.set(
        side * 1.05,
        -0.18,
        -0.52
    );

    engine.castShadow =
    true;

    aircraft.add(
        engine
    );


    /* Engine glow */

    const glowGeometry =
    new THREE.CylinderGeometry(
        0.23,
        0.23,
        0.08,
        28
    );

    const glowMaterial =
    new THREE.MeshBasicMaterial({
        color:0x00c8ff
    });

    const engineGlow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

    engineGlow.rotation.z =
    Math.PI / 2;

    engineGlow.position.set(
        side * 1.05,
        -0.18,
        -1.18
    );

    aircraft.add(
        engineGlow
    );
}

createEngine(1);
createEngine(-1);


/* =========================================================
   FRONT PROPELLER
========================================================= */

const propeller =
new THREE.Group();

propeller.position.set(
    0,
    0,
    -2.92
);

aircraft.add(
    propeller
);


/* Hub */

const hubGeometry =
new THREE.SphereGeometry(
    0.28,
    24,
    24
);

const hub =
new THREE.Mesh(
    hubGeometry,
    goldMaterial
);

propeller.add(
    hub
);


/* Blades */

for(let i=0;i<4;i++){

    const bladeGeometry =
    new THREE.BoxGeometry(
        0.16,
        1.65,
        0.08
    );

    const blade =
    new THREE.Mesh(
        bladeGeometry,
        darkMaterial
    );

    blade.position.y =
    0.82;

    blade.rotation.z =
    i * Math.PI / 2;

    blade.castShadow =
    true;

    propeller.add(
        blade
    );
}


/* =========================================================
   FRONT LIGHT
========================================================= */

const frontLightGeometry =
new THREE.SphereGeometry(
    0.12,
    16,
    16
);

const frontLight =
new THREE.Mesh(

    frontLightGeometry,

    new THREE.MeshBasicMaterial({
        color:0x00eaff
    })

);

frontLight.position.set(
    0,
    -0.12,
    -3.02
);

aircraft.add(
    frontLight
);


/* =========================================================
   FLY X LOGO
========================================================= */

const logoCanvas =
document.createElement("canvas");

logoCanvas.width =
512;

logoCanvas.height =
128;

const ctx =
logoCanvas.getContext("2d");

ctx.clearRect(
    0,
    0,
    512,
    128
);

ctx.font =
"bold 82px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillStyle =
"#ffffff";

ctx.fillText(
    "FLY X",
    256,
    64
);


const logoTexture =
new THREE.CanvasTexture(
    logoCanvas
);

logoTexture.colorSpace =
THREE.SRGBColorSpace;


const logoMaterial =
new THREE.MeshBasicMaterial({

    map:logoTexture,

    transparent:true,

    depthWrite:false

});


const logoGeometry =
new THREE.PlaneGeometry(
    1.8,
    0.45
);


const logo =
new THREE.Mesh(
    logoGeometry,
    logoMaterial
);

logo.position.set(
    0,
    0.03,
    -1.04
);

logo.rotation.y =
Math.PI;

aircraft.add(
    logo
);


/* =========================================================
   BLUE GLOW UNDER AIRCRAFT
========================================================= */

const groundGlowGeometry =
new THREE.CircleGeometry(
    3.6,
    64
);

const groundGlowMaterial =
new THREE.MeshBasicMaterial({

    color:0x0077ff,

    transparent:true,

    opacity:0.12,

    side:THREE.DoubleSide

});

const groundGlow =
new THREE.Mesh(
    groundGlowGeometry,
    groundGlowMaterial
);

groundGlow.rotation.x =
-Math.PI / 2;

groundGlow.position.y =
-1.35;

scene.add(
    groundGlow
);


/* =========================================================
   UNDER LIGHT
========================================================= */

const underLight =
new THREE.PointLight(
    0x0077ff,
    12,
    10
);

underLight.position.set(
    0,
    -1.2,
    0
);

scene.add(
    underLight
);


/* =========================================================
   AIRCRAFT START POSITION
========================================================= */

aircraft.position.set(
    0,
    0,
    0
);

/*
   IMPORTANT:
   Nose camera ki taraf rahega.
*/

aircraft.rotation.set(
    0,
    Math.PI,
    0
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
    clock.getElapsedTime();


    /* Propeller rotation */

    propeller.rotation.z +=
    0.5;


    /* Aircraft floating */

    aircraft.position.y =
        Math.sin(time * 1.5) * 0.08;


    /* Glow breathing */

    groundGlow.material.opacity =
        0.10 +
        Math.sin(time * 2) * 0.025;


    controls.update();


    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESPONSIVE
========================================================= */

function resize(){

    const width =
    window.innerWidth;

    const height =
    window.innerHeight;


    camera.aspect =
    width / height;

    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height
    );
}

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   WEBGL ERROR
========================================================= */

if(!renderer.getContext()){

    errorBox.style.display =
    "block";

    errorBox.innerText =
    "3D graphics is not supported on this device/browser.";

}

</script>

</body>
</html>
