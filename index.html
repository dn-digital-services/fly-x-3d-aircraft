<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLY X 3D Aircraft</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050b16;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #title {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="title">FLY X</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050b16);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(8, 5, 10);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);


// LIGHTING
const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(5, 8, 10);
scene.add(keyLight);

const blueLight = new THREE.PointLight(0x00aaff, 8, 30);
blueLight.position.set(0, 2, 5);
scene.add(blueLight);


// AIRCRAFT
const aircraft = new THREE.Group();
scene.add(aircraft);


// MATERIALS
const bodyMaterial = new THREE.MeshStandardMaterial({
  color: 0x303b4a,
  metalness: 0.85,
  roughness: 0.25
});

const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x080d14,
  metalness: 0.7,
  roughness: 0.2
});

const blueMaterial = new THREE.MeshStandardMaterial({
  color: 0x008cff,
  emissive: 0x003d77,
  emissiveIntensity: 1.5,
  metalness: 0.5,
  roughness: 0.25
});


// MAIN BODY
const bodyGeometry = new THREE.CapsuleGeometry(
  1.1,
  4.2,
  8,
  24
);

const body = new THREE.Mesh(
  bodyGeometry,
  bodyMaterial
);

body.rotation.z = Math.PI / 2;
body.scale.set(1, 0.75, 0.75);

aircraft.add(body);


// NOSE
const noseGeometry = new THREE.ConeGeometry(
  1.05,
  2.4,
  32
);

const nose = new THREE.Mesh(
  noseGeometry,
  bodyMaterial
);

nose.rotation.z = -Math.PI / 2;
nose.position.x = 3.1;

aircraft.add(nose);


// COCKPIT
const cockpitGeometry = new THREE.SphereGeometry(
  1,
  32,
  16
);

const cockpitMaterial = new THREE.MeshStandardMaterial({
  color: 0x061827,
  metalness: 0.8,
  roughness: 0.08,
  transparent: true,
  opacity: 0.9
});

const cockpit = new THREE.Mesh(
  cockpitGeometry,
  cockpitMaterial
);

cockpit.scale.set(1.25, 0.65, 0.7);
cockpit.position.set(1.25, 0, 0.65);

aircraft.add(cockpit);


// WINGS
function createWing(side) {

  const geometry = new THREE.BoxGeometry(
    3.8,
    0.18,
    1.3
  );

  const wing = new THREE.Mesh(
    geometry,
    darkMaterial
  );

  wing.position.set(
    -0.1,
    side * 1.65,
    0
  );

  wing.rotation.z =
    side === 1
      ? -0.12
      : 0.12;

  aircraft.add(wing);

  // BLUE EDGE
  const edgeGeometry =
    new THREE.BoxGeometry(3.6, 0.06, 0.08);

  const edge = new THREE.Mesh(
    edgeGeometry,
    blueMaterial
  );

  edge.position.set(
    -0.1,
    side * 2.25,
    0.05
  );

  aircraft.add(edge);
}

createWing(1);
createWing(-1);


// TAIL FIN
const tailGeometry =
  new THREE.BoxGeometry(
    1.5,
    0.15,
    1.4
  );

const tailFin = new THREE.Mesh(
  tailGeometry,
  blueMaterial
);

tailFin.position.set(-2.4, 0, 0.8);
tailFin.rotation.y = -0.25;

aircraft.add(tailFin);


// ENGINES
function createEngine(side) {

  const engineGeometry =
    new THREE.CylinderGeometry(
      0.45,
      0.55,
      2.0,
      32
    );

  const engine = new THREE.Mesh(
    engineGeometry,
    darkMaterial
  );

  engine.rotation.z = Math.PI / 2;

  engine.position.set(
    -1.0,
    side * 0.85,
    -0.55
  );

  aircraft.add(engine);

  // EXHAUST
  const exhaustGeometry =
    new THREE.ConeGeometry(
      0.25,
      1.3,
      24
    );

  const exhaustMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xff5a00
    });

  const exhaust =
    new THREE.Mesh(
      exhaustGeometry,
      exhaustMaterial
    );

  exhaust.rotation.z = -Math.PI / 2;

  exhaust.position.set(
    -2.5,
    side * 0.85,
    -0.55
  );

  aircraft.add(exhaust);
}

createEngine(1);
createEngine(-1);


// FRONT ROTOR
const rotor = new THREE.Group();

rotor.position.set(3.9, 0, 0);

aircraft.add(rotor);

const rotorMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x111820,
    metalness: 0.8,
    roughness: 0.2
  });

for (let i = 0; i < 4; i++) {

  const bladeGeometry =
    new THREE.BoxGeometry(
      2.1,
      0.08,
      0.16
    );

  const blade =
    new THREE.Mesh(
      bladeGeometry,
      rotorMaterial
    );

  blade.rotation.z =
    i * Math.PI / 2;

  rotor.add(blade);
}


// CENTER HUB
const hubGeometry =
  new THREE.SphereGeometry(
    0.3,
    24,
    16
  );

const hub =
  new THREE.Mesh(
    hubGeometry,
    blueMaterial
  );

rotor.add(hub);


// CONTROLS
const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;


// ANIMATION
function animate() {

  requestAnimationFrame(animate);

  rotor.rotation.x += 0.12;

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();


// RESPONSIVE
window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);
</script>

</body>
</html>
